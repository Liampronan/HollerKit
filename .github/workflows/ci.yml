name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Typecheck server
        run: npm run typecheck

      - name: Run server tests
        run: npm test

  ios:
    name: iOS Package Tests
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Swift tests
        run: |
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "${DEVICE_ID}"
          xcodebuild test \
            -scheme HollerKit \
            -destination "id=${DEVICE_ID}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

  ios-demo:
    name: iOS Demo Build
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build demo app
        run: |
          xcodebuild \
            -project examples/ios-demo/HollerKitDemo.xcodeproj \
            -scheme HollerKitDemo \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/HollerKitDemoDerived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
